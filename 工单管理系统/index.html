<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>工单管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="login-view" style="display:none">
    <div class="login-card">
      <div class="login-brand"><span class="logo">工</span><span>工单管理系统</span></div>
      <p class="login-sub">请登录后使用</p>
      <form id="login-form" class="login-form" autocomplete="off">
        <label class="login-field">
          <span>账号</span>
          <input id="login-username" type="text" placeholder="账号：admin / zhangwei / lina ..." autocomplete="off" />
        </label>
        <label class="login-field">
          <span>密码</span>
          <input id="login-password" type="password" placeholder="请输入密码" autocomplete="off" />
        </label>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="btn btn-primary login-submit">登录</button>
      </form>
      <div class="login-hint">管理员 admin / admin123　·　处理员 zhangwei·lina·wangqiang·liuyang·chenjing / 123456</div>
    </div>
  </div>
  <!-- PC 端容器 -->
  <div id="pc-app" class="pc-app">
    <header class="app-header">
      <div class="brand"><span class="logo">工</span><span>工单管理系统</span></div>
      <nav class="nav-tabs" id="nav-tabs">
        <button class="nav-tab" data-page="overview">概览</button>
        <button class="nav-tab" data-page="kanban">看板</button>
        <button class="nav-tab" data-page="list">工单列表</button>
        <button class="nav-tab" data-page="recycle">回收站</button>
        <button class="nav-tab" data-page="log">操作日志</button>
      </nav>
      <div class="header-right">
        <span id="sync-indicator" class="sync-indicator" style="display:none" title="同步状态"><span class="dot"></span><span class="label">同步</span></span>
        <button class="btn btn-ghost" id="sync-now-btn" style="display:none" title="立即把本地数据推送到 Supabase">↻ 立即同步</button>
                <div class="session-info" id="session-info">
          <span class="session-role" id="session-role">管理员</span>
          <span class="session-user" id="session-user">系统管理员</span>
        </div>
        <button class="btn btn-ghost" id="logout-btn">退出</button>
        <button class="btn btn-primary" id="new-ticket-btn">+ 新建工单</button>
        <a class="btn btn-ghost" href="#/m">移动端</a>
      </div>
    </header>
    <main class="main" id="pc-main"></main>
  </div>

  <!-- 移动 H5 容器 -->
  <div id="mobile-app" class="mobile-app" style="display:none"></div>

  <!-- 弹窗与提示挂载点 -->
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
